# Every Linux gate can be green while a Windows backend does not compile: the backend
# crates are `#![cfg(target_os = "windows")]`, so nothing built on Linux ever sees them.
# The first job is the cross-target check that closes that gap for the Windows target;
# the second runs the Path A probe described in `spi/spike-windows-path-a.md`.
name: Cross-target check

on:
  pull_request:
    branches: [bite_v1.22.0-pre]
  workflow_dispatch:

jobs:
  windows-cross-check:
    name: cargo check --target x86_64-pc-windows-msvc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add x86_64-pc-windows-msvc
      - run: cargo check --target x86_64-pc-windows-msvc -p gpui_windows

  path-a-probe:
    name: Path A probe (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo run --manifest-path probes/windows-path-a/Cargo.toml
