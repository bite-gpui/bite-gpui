# The fork's own CI, in one file.
#
# It is here, and not only in `bite-gpui/distribution`, because of how a
# `pull_request` run resolves its workflow files: from the pull request's *merge*
# commit, base and head together. A file that only a pull request adds therefore
# runs for that pull request and no other, so gating the pull requests that target
# a branch means carrying the file on that branch. Every `bite_*` branch is
# regenerated by replay, so the fewer files there are to carry, the less there is to
# keep in step.
#
# What it checks is chosen for the backends, which are the crates nothing else
# reaches. `gpui_windows.rs`, `gpui_macos.rs` and `gpui_apple.rs` each open with
# `#![cfg(target_os = "…")]`, so a Linux build compiles them to nothing — and the
# release pipeline's `verify.yml`, whose legs are Linux and macOS, never sees the
# Windows backend at all. The cross-target checks compile each backend for its own
# target from one Linux runner, which is how a pull request sees it.
#
# The checks that read the tree rather than the release tag stay in
# `bite-gpui/distribution` and are called rather than copied. `verify.yml` verifies
# a *target*, which means staging the branch, and staging refuses an untagged tip —
# exactly what a pull request's head is.
name: Bite CI

on:
  pull_request:
    branches: ['bite_*']
  workflow_dispatch:

jobs:
  # The target table and the naming rule. The ref is the distribution branch until
  # the entry point reaches `main`.
  checks:
    uses: bite-gpui/distribution/.github/workflows/pr-checks.yml@pr-checks
    with:
      repository: ${{ github.repository }}
      ref: ${{ github.sha }}

  # The Direct3D backend, compiled for its own target from Linux — the only way any
  # Linux leg sees it. It found a real defect the first time it ran.
  windows-cross-check:
    name: cargo check --target x86_64-pc-windows-msvc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add x86_64-pc-windows-msvc
      - run: cargo check --target x86_64-pc-windows-msvc -p gpui_windows

  # The Metal backend, the Windows check's mirror. The lib is gated on the target
  # and the build script on the host, so this used to fail on the artifact
  # `metal_renderer.rs` includes — one only a macOS host produced; the build script
  # writes it now when it is cross-checked. The Metal compiler still does not run
  # here, so this checks the Rust and not the shaders: the shaders need a macOS
  # runner.
  macos-cross-check:
    name: cargo check --target aarch64-apple-darwin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add aarch64-apple-darwin
      - run: cargo check --target aarch64-apple-darwin -p gpui_macos

  # Whether a Direct3D 12 texture created by `wgpu` can be opened by GPUI's
  # Direct3D 11 renderer, which is what the Path A half of the render-extension
  # design turns on (spi/windows-path-a.md). A real Windows runner, because the
  # interop is the thing being asked about.
  path-a-probe:
    name: Path A probe (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo run --manifest-path probes/windows-path-a/Cargo.toml
