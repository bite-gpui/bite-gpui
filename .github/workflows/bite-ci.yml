# The fork's own CI, in one file.
#
# It is here, and not only in `bite-gpui/distribution`, because of how a
# `pull_request` run resolves its workflow files: from the pull request's *merge*
# commit, base and head together. A file that only a pull request adds therefore
# runs for that pull request and no other, so gating the pull requests that target a
# branch means carrying the file on that branch. Every `bite_*` branch is regenerated
# by replay, so the fewer files there are to carry, the less there is to keep in step.
#
# The backends get their own runners because nothing else reaches them:
# `gpui_windows.rs`, `gpui_macos.rs` and `gpui_apple.rs` each open with
# `#![cfg(target_os = "…")]`, so a Linux build compiles them to nothing — and the
# release pipeline's `verify.yml`, whose legs are Linux and macOS, never compiles the
# Windows backend at all.
#
# Standard GitHub-hosted runners are free for a public repository, so checking on
# the real platforms costs wall-clock and nothing else.
#
# The checks that read the tree rather than the release tag stay in
# `bite-gpui/distribution` and are called rather than copied. `verify.yml` verifies a
# *target*, which means staging the branch, and staging refuses an untagged tip —
# exactly what a pull request's head is.
name: Bite CI

on:
  pull_request:
    branches: ['bite_*']
  workflow_dispatch:

jobs:
  # The target table and the naming rule. The ref is the distribution branch until
  # the entry point reaches `main`.
  checks:
    uses: bite-gpui/distribution/.github/workflows/pr-checks.yml@pr-checks
    with:
      repository: ${{ github.repository }}
      ref: ${{ github.sha }}

  # The Metal backend, on macOS, through the facade so the windowing and text code a
  # desktop build needs compiles too. This is the only place the Metal shaders are
  # compiled at all: the build script runs `xcrun metal`, and it runs for the host.
  macos:
    name: cargo check -p gpui (macos-14)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: cargo check -p gpui

  # Path A's Metal rows. They need a Metal device, which only a macOS runner has, and the one a
  # hosted runner has is real rather than emulated -- the presentation probe records `Apple
  # Paravirtual device`, a real Metal device behind a hypervisor, which is stronger than the
  # Windows rows' WARP. No release profile is needed, unlike the Windows job: `gpui_apple`'s build
  # script compiles the shaders with `xcrun metal` in every profile. The filter is the
  # imported-texture rows and not the crate's whole suite, and `grep` is what keeps the gate from
  # passing vacuously if the filter ever stops matching anything.
  macos-path-a:
    name: cargo test -p gpui_apple imported_texture (macos-14)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -o pipefail
          cargo test -p gpui_apple imported_texture 2>&1 | tee imported-texture-metal.log
          grep -qE "test result: ok\. [1-9][0-9]* passed" imported-texture-metal.log

  # The Direct3D backend, on Windows. Release rather than debug, because that is the
  # profile whose build script compiles the HLSL with `fxc` and whose Rust includes
  # the result; in debug those shaders are compiled at run time by
  # `D3DCompileFromFile` and a `check` never sees them. It also makes the job
  # unsatisfiable anywhere but Windows, which is the point.
  windows:
    name: cargo check --release -p gpui (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo check --release -p gpui

  # Path A's Direct3D rows. They need a swap chain and a device, which no Linux gate has and no
  # cross-compile reaches, and a hosted runner has both because it has WARP -- the probes record
  # `Microsoft Basic Render Driver`, which is enough for a readback even though it is not enough
  # to call a result "works on hardware". Release for the `windows` job's reason, which is also
  # what compiles the new fragment with `fxc` rather than type-checking the Rust that calls it.
  #
  # The filter is the imported-texture rows and not the crate's whole suite: the tests already in
  # `gpui_windows` -- rasterization, clipboard, keyboard -- have never run on a runner, and
  # deciding what a GPU-less or headless run means for them is its own change. `grep` is what
  # keeps the gate from passing vacuously if the filter ever stops matching anything.
  windows-path-a:
    name: cargo test --release -p gpui_windows imported_texture (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -o pipefail
          cargo test --release -p gpui_windows imported_texture 2>&1 | tee imported-texture.log
          grep -qE "test result: ok\. [1-9][0-9]* passed" imported-texture.log

  # The first tests these pull requests run. Upstream's `run_tests.yml` triggers here and is
  # then skipped: every test job in it is gated on `github.repository_owner` being
  # `zed-industries` or `zed-extensions`, and this fork is neither. So a branch can be green
  # with nothing executed, which is what this job is for.
  #
  # `-p gpui_authoring --lib` is where the renderer seam's test lives, and `-p gpui_engine --lib`
  # is where Path A's encoding tests do. Neither needs a display: the first opens a window through
  # `TestPlatform`, the second builds engine types and no window at all, so one runner is enough
  # and `script/linux` installs what their build needs. `gpui_wgpu`'s tests stay out, and not for
  # lack of trying: the three Path A rows they hold need a GPU *adapter*, which a bare runner is
  # not guaranteed to have, and the suite's older tests fail rather than skip without one. Widening
  # the filter to them means deciding what a GPU-less runner should do -- making those tests skip,
  # or the tests that need a device gated some other way -- which is its own change.
  tests:
    name: cargo test -p gpui_authoring -p gpui_engine --lib (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./script/linux
      - run: cargo test -p gpui_authoring -p gpui_engine --lib
