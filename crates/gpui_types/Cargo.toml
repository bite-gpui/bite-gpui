[package]
name = "gpui_types"
version = "0.1.0"
publish.workspace = true
edition.workspace = true
license = "Apache-2.0"

[lints]
workspace = true

[lib]
path = "src/gpui_types.rs"
doctest = false

[features]
default = []
lyon = ["dep:lyon", "dep:etagere"]

[dependencies]
anyhow.workspace = true
derive_more.workspace = true
etagere = { workspace = true, optional = true }
lyon = { version = "1.0", optional = true }
refineable.workspace = true
schemars.workspace = true
serde.workspace = true
taffy = "=0.13.0"

[dev-dependencies]
# The doc examples on the types in this crate are written against the public
# `gpui` API (they are re-exported there). Depend on the facade so doctests are
# compiled against `gpui::…` rather than this crate's internal name. Cargo
# permits this dev-dependency cycle (see rust-lang/cargo#6765).
gpui = { path = "../gpui", package = "gpui-ce", default-features = false }
serde_json.workspace = true
