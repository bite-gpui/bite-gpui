[package]
name = "gpui_platform"
version = "0.1.0"
publish.workspace = true
edition.workspace = true
license = "Apache-2.0"

[lints]
workspace = true

[lib]
path = "src/gpui_platform.rs"
doctest = false

[features]
default = []
# Forwarded from `gpui`/`gpui-ce`, which is where consumers turn these on.
#
# `test-support`/`bench-support` gate the test doubles (`TestAtlas`, `TestPrompts`,
# `TestKeyboardLayout`, `TestDisplay`, `TestSystemNotifications`) that `gpui`'s own
# test modules consume; `wayland`/`x11` select `guess_compositor`'s probe and the
# `layer_shell` module; `screen-capture` selects the native
# `PlatformScreenCaptureFrame` alias.
test-support = ["gpui_engine/test-support"]
bench-support = ["test-support", "gpui_engine/bench-support"]
# Forwarded from `gpui`/`gpui-ce`, which is where consumers turn this on. Gates the
# executor's foreground-runnable counting (`foreground_runnable_counter`).
profiler = []
wayland = []
x11 = []
screen-capture = []

[dependencies]
accesskit.workspace = true
anyhow.workspace = true
async-task.workspace = true
bitflags.workspace = true
chrono.workspace = true
collections.workspace = true
futures.workspace = true
gpui_engine.workspace = true
gpui_shared_string.workspace = true
gpui_types.workspace = true
gpui_util.workspace = true
image.workspace = true
log.workspace = true
num_cpus = "1.13"
parking = "2.0.0"
parking_lot.workspace = true
rand.workspace = true
raw-window-handle.workspace = true
scheduler.workspace = true
schemars.workspace = true
seahash = "4.1"
serde.workspace = true
serde_json.workspace = true
slotmap.workspace = true
smallvec.workspace = true
strum.workspace = true
thiserror.workspace = true
uuid.workspace = true
waker-fn = "1.2.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-video.workspace = true

[dev-dependencies]
# `gpui_engine` gates `PlatformAtlas::contains` behind its own `test-support` feature, which
# `cfg(test)` in this crate cannot turn on.
gpui_engine = { workspace = true, features = ["test-support"] }
