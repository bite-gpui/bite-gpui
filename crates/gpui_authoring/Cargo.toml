[package]
name = "gpui_authoring"
version = "0.1.0"
publish.workspace = true
edition.workspace = true
license = "Apache-2.0"

[lints]
workspace = true

[lib]
path = "src/gpui_authoring.rs"
doctest = false

[features]
default = []
# Test-only APIs: deterministic dispatchers, `TestAppContext`, and the renderer
# readback paths the leaves gate behind the same feature.
test-support = [
  "leak-detection",
  "collections/test-support",
  "gpui_engine/test-support",
  "gpui_engine_default/test-support",
  "gpui_platform/test-support",
  "wayland",
  "x11",
  "proptest",
]
bench-support = [
  "profiler",
  "dep:criterion",
  "gpui_engine/bench-support",
  "gpui_engine_default/bench-support",
  "gpui_platform/bench-support",
]
# Preserve the published feature name while consumers migrate to `bench-support`.
bench = ["bench-support"]
inspector = ["gpui_macros/inspector"]
leak-detection = ["backtrace"]
wayland = ["gpui_platform/wayland"]
x11 = ["gpui_platform/x11"]
screen-capture = [
  "dep:windows-capture",
  "gpui_engine/screen-capture",
  "gpui_platform/screen-capture",
]
profiler = ["dep:hdrhistogram", "gpui_platform/profiler"]
stacker = ["dep:stacksafe", "gpui_engine_default/stacker"]

[dependencies]
accesskit.workspace = true
anyhow.workspace = true
async-task.workspace = true
backtrace = { workspace = true, optional = true }
bitflags.workspace = true

collections.workspace = true
criterion = { workspace = true, optional = true }
ctor.workspace = true
derive_more.workspace = true
etagere.workspace = true
futures.workspace = true
futures-concurrency.workspace = true
gpui_macros.workspace = true
gpui_engine.workspace = true
gpui_engine_default.workspace = true
gpui_platform.workspace = true
gpui_shared_string.workspace = true
gpui_types = { workspace = true, features = ["lyon"] }
gpui_ce_types.workspace = true
http.workspace = true
image.workspace = true
inventory.workspace = true
itertools.workspace = true
log.workspace = true
num_cpus = "1.13"
parking = "2.0.0"
parking_lot.workspace = true
postage.workspace = true
proptest = { workspace = true, optional = true }
chrono.workspace = true
profiling.workspace = true
rand.workspace = true
raw-window-handle.workspace = true
regex.workspace = true
refineable.workspace = true
scheduler.workspace = true
resvg = { version = "0.48.1", default-features = false, features = [
  "text",
  "system-fonts",
  "memmap-fonts",
  "raster-images",
] }
usvg = { version = "0.48.1", default-features = false }
skrifa.workspace = true
schemars.workspace = true
seahash = "4.1"
serde.workspace = true
serde_json.workspace = true
slotmap.workspace = true
smallvec.workspace = true
async-channel.workspace = true
stacksafe = { workspace = true, optional = true }
strum.workspace = true
sum_tree.workspace = true
thiserror.workspace = true
tracing.workspace = true
gpui_util.workspace = true
unicode-segmentation.workspace = true
hdrhistogram = { workspace = true, optional = true }
waker-fn = "1.2.0"
lyon = "1.0"
pin-project = "1.1.10"
spin = "0.10.0"
pollster.workspace = true
url.workspace = true
uuid.workspace = true
web-time.workspace = true
heapless.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { version = "0.3.4", features = ["wasm_js"] }
uuid = { workspace = true, features = ["js"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-video.workspace = true
core-text = "21"
font-kit = { version = "0.14.1-zed", package = "zed-font-kit", optional = true }
foreign-types = "0.5"
log.workspace = true
objc2 = { workspace = true, optional = true }
objc2-metal = { version = "0.3", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_System_Power",
] }
windows-capture = { workspace = true, optional = true }
windows-061 = { workspace = true, features = ["Win32_Graphics_Direct3D11"] }

[dev-dependencies]
accesskit_consumer.workspace = true
backtrace.workspace = true
smol.workspace = true
collections = { workspace = true, features = ["test-support"] }
env_logger.workspace = true
# `gpui_engine`, `gpui_platform` and `gpui_ce_platform` gate their test doubles behind
# their own `test-support` feature, which `cfg(test)` in this crate cannot turn on.
gpui_engine = { workspace = true, features = ["test-support"] }
gpui_platform = { workspace = true, features = ["test-support"] }
gpui_ce_platform = { workspace = true, features = ["font-kit", "wayland", "x11"] }
gpui_util = { workspace = true }
lyon = { version = "1.0", features = ["extra"] }
rand.workspace = true
scheduler = { workspace = true, features = ["test-support"] }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
proptest = { workspace = true }

[target.'cfg(target_family = "wasm")'.dev-dependencies]
wasm-bindgen = { workspace = true }
web-sys = { version = "0.3", features = ["console"] }

[package.metadata.cargo-shear]
ignored = [
  "font-kit",
  "getrandom",
  "objc2",
  "objc2-metal",
  "tracing",
]
ignored-paths = ["src/_ownership_and_data_flow.rs"]
