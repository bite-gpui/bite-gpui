[package]
name = "gpui_authoring"
version = "0.2.2"
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"
authors = ["Nathan Sobo <nathan@zed.dev>"]
description = "Zed's declarative UI authoring layer"
repository = "https://github.com/zed-industries/zed"
homepage = "https://gpui.rs"
keywords = ["desktop", "gui", "immediate"]
categories = ["gui"]


[lints]
workspace = true

[features]
default = []
# Test-only APIs: deterministic dispatchers, `TestAppContext`, and the
# renderer readback paths the engine gates behind the same feature.
test-support = [
    "leak-detection",
    "collections/test-support",
    "gpui_engine/test-support",
    "gpui_engine_default/test-support",
    "gpui_platform/test-support",
    "gpui_types/test-support",
    "http_client/test-support",
    "proptest",
    "dep:futures-concurrency",
    "dep:postage",
    "dep:web-time",
]
bench-support = [
    "profiler",
    "dep:criterion",
    "dep:bench_metrics",
    "gpui_engine/bench-support",
    "gpui_engine_default/bench-support",
    "gpui_platform/bench-support",
]
# Preserve the published feature name while consumers migrate to `bench-support`.
bench = ["bench-support"]
inspector = ["gpui_macros/inspector"]
# Tracks every entity handle so tests can assert nothing leaked. Also enabled
# by setting `GPUI_LEAK_DETECTION` when building; see `build.rs`.
leak-detection = ["backtrace"]
profiler = ["dep:hdrhistogram", "gpui_platform/profiler"]
stacker = ["dep:stacksafe", "gpui_engine_default/stacker"]

[lib]
path = "src/gpui_authoring.rs"
doctest = false

[dependencies]
accesskit.workspace = true
anyhow.workspace = true
arc-swap.workspace = true
async-task.workspace = true
backtrace = { workspace = true, optional = true }
collections.workspace = true
bench_metrics = { workspace = true, optional = true }
libc.workspace = true
criterion = { workspace = true, optional = true }
ctor.workspace = true
derive_more.workspace = true
etagere.workspace = true
futures.workspace = true
futures-concurrency = { workspace = true, optional = true }
gpui_engine.workspace = true
gpui_engine_default.workspace = true
gpui_macros.workspace = true
gpui_platform.workspace = true
gpui_types = { workspace = true, features = ["lyon"] }
gpui_util.workspace = true
hdrhistogram = { workspace = true, optional = true }
heapless.workspace = true
http_client.workspace = true
image.workspace = true
inventory.workspace = true
itertools.workspace = true
log.workspace = true
lyon = "1.0"
parking_lot.workspace = true
pin-project = "1.1.10"
postage = { workspace = true, features = ["blocking"], optional = true }
proptest = { workspace = true, optional = true }
chrono = { workspace = true, default-features = true }
profiling.workspace = true
rand = { workspace = true, features = ["small_rng", "thread_rng"] }
raw-window-handle.workspace = true
regex = { workspace = true, default-features = true }
refineable.workspace = true
scheduler.workspace = true
resvg.workspace = true
usvg.workspace = true
ttf-parser = "0.25"
schemars = { workspace = true, features = ["derive"] }
seahash = "4.1"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
slotmap.workspace = true
smallvec.workspace = true
spin = "0.10.0"
stacksafe = { workspace = true, optional = true }
sum_tree.workspace = true
thiserror.workspace = true
tracing.workspace = true
url.workspace = true
uuid = { workspace = true, features = ["v4"] }
waker-fn = "1.2.0"
web-time = { workspace = true, optional = true }
util_macros.workspace = true
ztracing.workspace = true

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
async-channel.workspace = true

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
async-channel = { workspace = true, features = ["std"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
pollster.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
console_error_panic_hook.workspace = true
getrandom = { version = "0.3.4", features = ["wasm_js"] }
uuid = { workspace = true, features = ["js"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-video.workspace = true


[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_System_Power"] }

[dev-dependencies]
backtrace.workspace = true
bench_metrics = { workspace = true, features = ["test-support"] }
collections = { workspace = true, features = ["test-support"] }
env_logger.workspace = true
futures-concurrency.workspace = true
postage = { workspace = true, features = ["blocking"] }
web-time.workspace = true
gpui_engine_default = { workspace = true, features = ["test-support"] }
gpui_platform = { workspace = true, features = ["test-support"] }
gpui_util.workspace = true
lyon = { version = "1.0", features = ["extra"] }
rand = { workspace = true, default-features = true }
scheduler = { workspace = true, features = ["test-support"] }
unicode-segmentation.workspace = true
util_macros.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
http_client = { workspace = true, features = ["test-support"] }
proptest.workspace = true
reqwest_client = { workspace = true, features = ["test-support"] }

[target.'cfg(target_family = "wasm")'.dev-dependencies]
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = ["console"] }

[package.metadata.cargo-shear]
ignored = [
    "getrandom",
    "tracing",
]
ignored-paths = ["src/_ownership_and_data_flow.rs"]
